name: Profile activity
on:
  workflow_dispatch:
  schedule:
    - cron: '31 3 * * *'
  push:
    branches: [main]
    paths:
      - '.github/workflows/profile-activity.yml'
      - 'scripts/render_activity.py'
permissions:
  contents: read
concurrency:
  group: profile-activity
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out profile
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4 ref inspected 2026-11-05
        with:
          ref: main
      - name: Generate activity card
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PROFILE_OWNER: ${{ github.repository_owner }}
        run: python3 scripts/render_activity.py
      - name: Generate contribution snake
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3 ref inspected 2026-11-05
        with:
          github_user_name: ${{ github.repository_owner }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          outputs: |
            assets/contribution-snake.svg?palette=github-dark&color_snake=%23F0B06A&color_dots=%231C1827,%233B2858,%236B43A1,%23946BDB,%23C4AFF8
      - name: Commit generated activity only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/activity.svg assets/contribution-snake.svg
          if ! git diff --cached --quiet; then
            git commit -m 'Update generated profile activity'
            git push origin HEAD:main
          fi
